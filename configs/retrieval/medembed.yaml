# Embedder ablation: does a domain-specific embedder retrieve better medicine?
#
# MedEmbed-large-v0.1 is a domain fine-tune *of bge-large-en-v1.5 itself* — same
# architecture, same 1024 dimensions, same tokenizer, differing only in domain
# adaptation. That makes this an unusually clean one-variable comparison: a
# different embedder family would confound "medical training" with "better
# model". Apache 2.0 and ungated.
#
# Retrieval settings below are identical to the bge_large control, so any
# difference in the arms is the embedding, not the budget or the k.

embedder:
  name: MedEmbed-large-v0.1
  repo_id: abhinand/MedEmbed-large-v0.1
  revision: 963121bfb9c625475f65b08fb54990ce9c4e7a1a  # pragma: allowlist secret
  dimensions: 1024
  # The model's hard limit. Corpus chunks are sized well under this so nothing
  # is silently truncated out of the index.
  max_seq_length: 512
  batch_size: 256
  device: 1
  # float32 (the SentenceTransformer default) runs 4.3x slower on an A40:
  # 248 vs 1,054 chunks/s. Checked equivalent for retrieval before switching —
  # cosine >= 0.9995 vs fp32, top-1 agreement 1.000, top-5 overlap 0.998.
  dtype: float16
  normalize: true
  # Inherited from the bge base MedEmbed was fine-tuned from, and kept identical
  # to the control so the prefix is not a second variable in this comparison.
  query_prefix: "Represent this sentence for searching relevant passages: "

retrieval:
  top_k: 5
  # Shared by rag-external and rag-parity. The two corpora have different
  # natural chunk lengths, so a fixed k would give one arm more context than
  # the other and confound quality with prefill cost. Budgeting characters
  # makes the arms cost the same and differ only in content.
  max_context_chars: 3000
  min_score: 0.0
  rerank: false
