# MIRIAD parity, `doc` variant: fine-tune on the passage text itself, chunked
# with the same chunker the index uses. The weights and the index were shown
# byte-identical content — the variant where information parity is literal.
name: miriad-doc
model_config_path: configs/model/qwen3-8b.yaml
dataset: miriad-doc
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
quantization: nf4
learning_rate: 2.0e-4
lr_scheduler: cosine
warmup_ratio: 0.03
weight_decay: 0.0
max_grad_norm: 1.0
epochs: 1.0
# Chunks are ~125 tokens against the qa variant's ~500, so the per-device batch
# is 4x larger and accumulation 4x smaller: the effective batch of 16 — the part
# of the recipe that affects optimisation — is unchanged, and the run is not four
# times slower than it needs to be. max_seq_length 512 bounds a 600-char chunk
# with room to spare. 189k chunks is the whole index; subsampling would break
# the literal-parity claim, so the cost is taken rather than trimmed.
per_device_batch_size: 16
gradient_accumulation_steps: 1
max_seq_length: 512
gradient_checkpointing: true
max_train_samples: null
include_explanation: true
save_steps: 200
eval_steps: 200
logging_steps: 10
save_total_limit: 3
metric_for_best_model: eval_loss
seed: 42
optim: paged_adamw_8bit
report_to: none
