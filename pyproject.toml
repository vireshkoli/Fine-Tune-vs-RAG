[project]
name = "fine-tune-vs-rag"
version = "0.1.0"
description = "A controlled benchmark: when is fine-tuning worth it versus just retrieving?"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Viresh Koli" }]

# Kept deliberately small in Phase 1. Heavy ML deps (torch, transformers, peft, trl,
# bitsandbytes, vllm, faiss) arrive with the phase that first needs them, so CI stays
# CPU-only and fast. See the `gpu` optional group below.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "rich>=13.9",
    "typer>=0.15",
    "psutil>=6.1",
    "huggingface-hub>=0.27",
    # Metrics (bootstrap CIs, McNemar) run in CI, so numpy/scipy are core, not GPU extras.
    "numpy>=2.1",
    "scipy>=1.14",
    # Data loading and cleaning are CPU work and must stay testable without torch.
    "datasets>=3.2",
]

[project.optional-dependencies]
# Installed on the GPU box only; never in CI.
gpu = [
    "torch>=2.5",
    "transformers>=4.48",
    "accelerate>=1.2",
    "datasets>=3.2",
    "peft>=0.14",
    "trl>=0.13",
    "bitsandbytes>=0.45",
    "sentence-transformers>=3.3",
    "faiss-cpu>=1.9",
    "wandb>=0.19",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "types-pyyaml>=6.0",
    "pre-commit>=4.0",
    "pandas-stubs>=3.0.5.260730",
    "scipy-stubs>=1.18.0.1",
]

# The lab GPU runs NVIDIA driver 570.133.07 (CUDA 12.8). PyPI's default torch
# wheel is built against CUDA 13.0 and refuses to initialise here. Updating the
# driver is not an option — this is shared university hardware — so torch comes
# from the cu128 index instead. Anyone reproducing on a newer driver can drop
# this block; anyone on 12.x needs it.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fvr"]

# ----------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtin shadowing
    "C4",       # comprehensions
    "SIM",      # simplify
    "PTH",      # use pathlib
    "RUF",
]
ignore = [
    "E501",  # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Entry points must pin CUDA_VISIBLE_DEVICES and the HF cache before torch or
# huggingface_hub is imported, so their imports genuinely cannot all sit at the
# top of the file. See the comment at the head of scripts/04_train.py.
"scripts/*" = ["E402"]

# ----------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party ML libraries ship incomplete or absent stubs.
module = [
    "torch.*", "transformers.*", "peft.*", "trl.*", "bitsandbytes.*",
    "datasets.*", "faiss.*", "sentence_transformers.*", "wandb.*", "vllm.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The one module that touches transformers/peft constructors directly. Those
# ship unannotated callables, so strict mode rejects every call into them.
# Scoped to this single file rather than relaxed globally — everything else,
# including all eval and data code, stays fully strict.
module = ["fvr.models.loader", "fvr.train.qlora"]
disallow_untyped_calls = false

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "gpu: requires a CUDA device (never runs in CI)",
    "network: requires internet access",
    "slow: takes more than a few seconds",
]

[tool.coverage.run]
source = ["src/fvr"]
branch = true
