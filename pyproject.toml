[project]
name = "fine-tune-vs-rag"
version = "0.1.0"
description = "A controlled benchmark: when is fine-tuning worth it versus just retrieving?"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Viresh Koli" }]

# Kept deliberately small in Phase 1. Heavy ML deps (torch, transformers, peft, trl,
# bitsandbytes, vllm, faiss) arrive with the phase that first needs them, so CI stays
# CPU-only and fast. See the `gpu` optional group below.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "rich>=13.9",
    "typer>=0.15",
    "psutil>=6.1",
    "huggingface-hub>=0.27",
    # Metrics (bootstrap CIs, McNemar) run in CI, so numpy/scipy are core, not GPU extras.
    "numpy>=2.1",
    "scipy>=1.14",
]

[project.optional-dependencies]
# Installed on the GPU box only; never in CI.
gpu = [
    "torch>=2.5",
    "transformers>=4.48",
    "accelerate>=1.2",
    "datasets>=3.2",
    "peft>=0.14",
    "trl>=0.13",
    "bitsandbytes>=0.45",
    "sentence-transformers>=3.3",
    "faiss-cpu>=1.9",
    "wandb>=0.19",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "types-pyyaml>=6.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fvr"]

# ----------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtin shadowing
    "C4",       # comprehensions
    "SIM",      # simplify
    "PTH",      # use pathlib
    "RUF",
]
ignore = [
    "E501",  # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# ----------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party ML libraries ship incomplete or absent stubs.
module = [
    "torch.*", "transformers.*", "peft.*", "trl.*", "bitsandbytes.*",
    "datasets.*", "faiss.*", "sentence_transformers.*", "wandb.*", "vllm.*",
]
ignore_missing_imports = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "gpu: requires a CUDA device (never runs in CI)",
    "network: requires internet access",
    "slow: takes more than a few seconds",
]

[tool.coverage.run]
source = ["src/fvr"]
branch = true
