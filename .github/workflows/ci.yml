name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI has no GPU. Keep every cache inside the workspace so nothing here
  # depends on a machine-specific location.
  HF_HOME: ${{ github.workspace }}/.artifacts/hub
  HF_HUB_OFFLINE: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # CPU only — no torch, no GPU extras. The model is mocked in tests.
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest -m "not gpu and not network" --cov --cov-report=term-missing
